name: Build & Deploy HintKeep

on:
  push:
    branches:
      - vNext
      - vNext-a11y-feature-test

concurrency:
  group: test
  cancel-in-progress: true

jobs:
  buildGraphQL:
    name: Build GraphQL
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            Features
            GraphQL

      - name: Setup Dotnet 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.x

      - name: Test
        shell: pwsh
        working-directory: GraphQL
        run: |
          dotnet test 'HintKeep.GraphQL.csproj' `
            --configuration Debug

      - name: Build
        shell: pwsh
        working-directory: GraphQL
        run: |
          dotnet publish 'HintKeep.GraphQL.csproj' `
            --configuration Release `
            --runtime linux-x64 `
            --no-self-contained `
            --output 'publish'

      - name: Publish Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GraphQL
          path: ./GraphQL/publish
          compression-level: 9
          include-hidden-files: true

  buildWebClient:
    name: Build WebClient
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            Features
            WebClient

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22.x

      - name: Restore
        working-directory: WebClient
        run: npm install

      - name: Build
        working-directory: WebClient
        run: npm run build-release

      - name: Test Units
        working-directory: WebClient
        run: npm run test:units

      - name: Prepare Features Test Report Output Directory
        working-directory: WebClient
        run: |
          mkdir ./FeaturesTestReport
          cp ./publish/*.css ./FeaturesTestReport

      - name: Test Features
        working-directory: WebClient
        run: npm run test:features
        env:
          templateFilePath: ./publish/index.html
          failedScenarioHtmlSnapshotDirectoryPath: ./FeaturesTestReport/FailedScenariosSnapshots
          stepHtmlSnapshotDirectoryPath: ./FeaturesTestReport/StepsSnapshots

      - name: Check Accessibility (be-a11y)
        uses: be-lenka/be-a11y@v2.2.9
        continue-on-error: true
        with:
          url: ./WebClient/FeaturesTestReport/StepsSnapshots
          report: ./WebClient/FeaturesTestReport/a11y-report.json

      - name: Publish Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: WebClient
          path: ./WebClient/publish
          compression-level: 9

      - name: Publish Features Test Report Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FeaturesTestReport
          path: ./WebClient/FeaturesTestReport
          compression-level: 9

  updateDocumentation:
    needs:
      - buildWebClient
      - buildGraphQL
    name: Update Documentation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: 'src'
          sparse-checkout: |
            .development
            .docs
            Features

      - name: Checkout Wiki
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}.wiki
          path: 'wiki'

      - name: Update Wiki
        shell: pwsh
        run: |
          Import-Module (Join-Path '.' 'src' 'dev-tools.psm1')

          Get-ChildItem `
            -Path 'wiki' `
            -Include "Features-`u{2010}-*.md" `
            -File `
            -Recurse `
          | Remove-Item

          Convert-FeaturesToMarkdown `
            -SourceUrl 'https://github.com/${{ github.repository }}/tree/${{ github.ref_name }}/Features' `
            -SourceDirectory 'src/Features' `
            -DestinationDirectory 'wiki'

          Convert-HandlebarsToMarkdown `
            -TemplatesDirectory 'src/.docs' `
            -DestinationDirectory 'wiki'

          Set-Location wiki

          git config --local user.name 'GitHub Action'
          git config --local user.email 'action@github.com'

          git add --all
          git diff-index --quiet HEAD
          if ($LASTEXITCODE) {
            git commit --message "Updated documentation"
            git push
          }

  deploy:
    needs:
      - updateDocumentation
    name: Deploy on Test
    runs-on: ubuntu-latest
    environment: Test
    permissions:
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            .infrastructure

      - name: Download Artifacts
        uses: actions/download-artifact@v5

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Ensure GraphQL Environment
        id: ensure-graphQL-environment
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $env:HINTKEEP_HASH_KEY = '${{ secrets.HINTKEEP_HASH_KEY }}'
          $env:HINTKEEP_SIGNING_KEY = '${{ secrets.HINTKEEP_SIGNING_KEY }}'

          $azureResources = az deployment sub create `
            --name 'hintkeep-test' `
            --location 'westeurope' `
            --parameters (Join-Path '.infrastructure' 'Environments' 'test.bicepparam') `
            --query 'properties.outputs' `
          | ConvertFrom-Json

          Write-Output "GraphQL_AppName=$($azureResources.functionsAppName.value)" | Out-File -Append $env:GITHUB_OUTPUT
          Write-Output "GraphQL_ResourceGroup=$($azureResources.resourceGroupName.value)" | Out-File -Append $env:GITHUB_OUTPUT
          Write-Output "GraphQL_URL=$($azureResources.functionsAppUrl.value)" | Out-File -Append $env:GITHUB_OUTPUT

      - name: Deploy GraphQL
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          Get-ChildItem `
            -Path 'GraphQL' `
          | Compress-Archive `
            -DestinationPath 'GraphQL.zip' `
            -CompressionLevel Optimal `
          | Out-Null

          Get-ChildItem `
            -Path 'GraphQL' `
            -Hidden `
          | Compress-Archive `
            -DestinationPath 'GraphQL.zip' `
            -CompressionLevel Optimal `
            -Update `
          | Out-Null

          az functionapp deployment source config-zip `
            --name '${{ steps.ensure-graphQL-environment.outputs.GraphQL_AppName }}' `
            --resource-group '${{ steps.ensure-graphQL-environment.outputs.GraphQL_ResourceGroup }}' `
            --src ./GraphQL.zip `
            --build-remote false `
          | Out-Null

      - name: Ensure WebClient Settings
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          [hashtable] $netlifySettings = @{
            HINTKEEP_API_URL = '${{ steps.ensure-graphQL-environment.outputs.GraphQL_URL }}'
          }

          $netlifySettings.GetEnumerator() | ForEach-Object -Parallel {
            Invoke-RestMethod `
              -Method Patch `
              -Uri "https://api.netlify.com/api/v1/accounts/${{ vars.NETLIFY_TEAM_ID }}/env/$($_.key)?site_id=${{ vars.NETLIFY_SITE_ID }}" `
              -ContentType 'application/json' `
              -Authentication Bearer `
              -Token (ConvertTo-SecureString -AsPlainText '${{ secrets.NETLIFY_DEPLOY_TOKEN }}') `
              -Body (@{
                context = 'production'
                value = $_.value
              } | ConvertTo-Json -Compress) `
            | Out-Null
          }

      - name: Ensure WebClient Post-Processing Scripts
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          [System.IO.FileInfo[]] $postProcessScripts = Get-ChildItem -File `
            (Join-Path '.infrastructure' 'Netlify' 'Post-Processing Scripts' '*.liquid')

          $netlifySnippets = Invoke-RestMethod `
            -Method Get `
            -Uri "https://api.netlify.com/api/v1/sites/${{ vars.NETLIFY_SITE_ID }}/snippets" `
            -Authentication Bearer `
            -Token (ConvertTo-SecureString -AsPlainText '${{ secrets.NETLIFY_DEPLOY_TOKEN }}')

          $netlifySnippets `
          | Where-Object {
            [string] $scriptTitle = $_.title

            [System.IO.FileInfo] $matchingScript = $postProcessScripts `
            | Where-Object { $_.BaseName -ieq $scriptTitle } `
            | Select-Object -First 1

            return $null -eq $matchingScript
          } `
          | Sort-Object -Property id -Descending `
          | ForEach-Object {
            Write-Output "Deleting '$($_.title)' post-process script"

            Invoke-RestMethod `
              -Method Delete `
              -Uri "https://api.netlify.com/api/v1/sites/${{ vars.NETLIFY_SITE_ID }}/snippets/$($_.id)" `
              -Authentication Bearer `
              -Token (ConvertTo-SecureString -AsPlainText '${{ secrets.NETLIFY_DEPLOY_TOKEN }}') `
            | Out-Null
          }

          $postProcessScripts | ForEach-Object {
            [string] $scriptTitle = $_.BaseName

            $matchingSnippet = $netlifySnippets `
            | Where-Object { $_.title -ieq $scriptTitle } `
            | Select-Object -First 1

            if ($null -eq $matchingSnippet) {
              Write-Output "Creating '$scriptTitle' post-process script"

              Invoke-RestMethod `
                -Method Post `
                -Uri "https://api.netlify.com/api/v1/sites/${{ vars.NETLIFY_SITE_ID }}/snippets" `
                -ContentType 'application/json' `
                -Authentication Bearer `
                -Token (ConvertTo-SecureString -AsPlainText '${{ secrets.NETLIFY_DEPLOY_TOKEN }}') `
                -Body (@{
                  title = $_.BaseName
                  general = Get-Content $_.FullName
                  general_position = 'head'
                } | ConvertTo-Json -Compress) `
              | Out-Null
            }
            else {
              Write-Output "Updating '$scriptTitle' post-process script"

              Invoke-RestMethod `
                -Method Put `
                -Uri "https://api.netlify.com/api/v1/sites/${{ vars.NETLIFY_SITE_ID }}/snippets/$($matchingSnippet.id)" `
                -ContentType 'application/json' `
                -Authentication Bearer `
                -Token (ConvertTo-SecureString -AsPlainText '${{ secrets.NETLIFY_DEPLOY_TOKEN }}') `
                -Body (@{
                  title = $scriptTitle
                  general = Get-Content $_.FullName
                  general_position = 'head'
                } | ConvertTo-Json -Compress) `
              | Out-Null
            }
          }

      - name: Deploy WebClient
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          Get-ChildItem `
            -Path 'WebClient' `
          | Compress-Archive `
            -DestinationPath 'WebClient.zip' `
            -CompressionLevel Optimal `
          | Out-Null

          Invoke-RestMethod `
            -Method Post `
            -Uri 'https://api.netlify.com/api/v1/sites/${{ vars.NETLIFY_SITE_ID }}/deploys' `
            -ContentType 'application/zip' `
            -Authentication Bearer `
            -Token (ConvertTo-SecureString -AsPlainText '${{ secrets.NETLIFY_DEPLOY_TOKEN }}') `
            -InFile WebClient.zip `
          | Out-Null