name: Build & Deploy HintKeep

on:
  push:
    branches:
      - vNext
      - vNextCD

concurrency:
  group: test
  cancel-in-progress: true

jobs:
  buildGraphQL:
    name: Build GraphQL
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Dotnet 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.x

      - name: Test
        shell: pwsh
        working-directory: GraphQL
        run: |
          dotnet test `
            --configuration Debug

      - name: Build
        shell: pwsh
        working-directory: GraphQL
        run: |
          dotnet publish ./HintKeep.GraphQL.csproj `
            --configuration Release `
            --runtime linux-x64 `
            --no-self-contained `
            --output 'publish'

      - name: Publish Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GraphQL
          path: ./GraphQL/publish
          compression-level: 9
          include-hidden-files: true

  buildWebClient:
    name: Build WebClient
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22.x

      - name: Restore
        working-directory: WebClient
        run: npm install

      - name: Test
        working-directory: WebClient
        run: npm run test

      - name: Build
        working-directory: WebClient
        run: npm run build-release

      - name: Publish Artifact
        uses: actions/upload-artifact@v4
        with:
          name: WebClient
          path: ./WebClient/publish
          compression-level: 9

  deployment:
    needs:
      - buildWebClient
      - buildGraphQL
    name: Deployment on Test
    runs-on: ubuntu-latest
    environment: Test
    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@v5

      # REQUIRED: setup service principal for deploying bicep & function apps
      #
      # - name: Deploy GraphQL
      #   shell: pwsh
      #   run: |
      #     $ErrorActionPreference = 'Stop'

      #     Get-ChildItem `
      #       -Path 'GraphQL' `
      #     | Compress-Archive `
      #       -DestinationPath 'GraphQL.zip' `
      #       -CompressionLevel Optimal `
      #     | Out-Null

      #     Get-ChildItem `
      #       -Path 'GraphQL' `
      #       -Hidden `
      #     | Compress-Archive `
      #       -DestinationPath 'GraphQL.zip' `
      #       -CompressionLevel Optimal `
      #       -Update `
      #     | Out-Null

      #     # $azureResources = az deployment sub create `
      #     #   --name 'hintkeep-test' `
      #     #   --location 'westeurope' `
      #     #   --parameters (Join-Path '.infrastructure' 'Environments' 'test.bicepparam') `
      #     #   --query 'properties.outputs' `
      #     # | ConvertFrom-Json

      #     # az functionapp deployment source config-zip `
      #     #   --name $azureResources.functionsAppName.value `
      #     #   --resource-group $azureResources.resourceGroupName.value `
      #     #   --src ./GraphQL.zip `
      #     #   --build-remote false `
      #     # | Out-Null

      - name: Deploy WebClient
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          Get-ChildItem `
            -Path 'WebClient' `
          | Compress-Archive `
            -DestinationPath 'WebClient.zip' `
            -CompressionLevel Optimal `
          | Out-Null

          Invoke-RestMethod `
            -Method Post `
            -Uri 'https://api.netlify.com/api/v1/sites/${{ vars.SITE_ID }}/deploys' `
            -ContentType 'application/zip' `
            -Authentication Bearer `
            -Token (ConvertTo-SecureString -AsPlainText '${{ secrets.DEPLOY_TOKEN }}') `
            -InFile WebClient.zip `
          | Out-Null